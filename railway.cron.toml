# Railway-Config NUR für den Newsletter-Cron-Service.
#
# WICHTIG: Im Dashboard des Cron-Service unter
#   Settings → Config → "Railway Config File"  →  railway.cron.toml
# hinterlegen. Dadurch liest dieser Service NICHT die normale railway.toml
# (also kein "next start", kein Healthcheck), sondern stößt nur den geschützten
# Endpoint an und beendet sich wieder – genau das, was ein Cron-Service braucht.
# (Config-as-Code überschreibt Dashboard-Einstellungen, deshalb die eigene Datei.)
#
# Der Schedule läuft in UTC. Das Fenster deckt Do 18:00 und Fr 09:00 Europe/Berlin
# über Sommer- und Winterzeit ab; die exakte Berlin-Zeit prüft der Endpoint
# (/api/cron/newsletter) selbst und arbeitet idempotent – zusätzliche Treffer im
# Fenster sind harmlose No-ops.

[build]
builder = "nixpacks"
# Kein Next-Build nötig – der Cron ruft nur scripts/trigger-cron.mjs auf.
buildCommand = "echo 'Cron-Service: kein Build noetig'"

[deploy]
startCommand = "node scripts/trigger-cron.mjs"
cronSchedule = "0 6-9,15-18 * * 4,5"
# Kein Auto-Retry bei Fehlern – der nächste Cron-Tick versucht es ohnehin erneut.
restartPolicyType = "never"
