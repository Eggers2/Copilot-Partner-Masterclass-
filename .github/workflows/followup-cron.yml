name: Follow-up Cron

# Stößt den geschützten Endpoint /api/cron/followup an (Wartelisten-Sequenz,
# lib/followup). Die Zeitprüfung liegt serverseitig: der Endpoint versendet nur
# werktags zwischen 8 und 18 Uhr Europe/Berlin und claimt jeden Schritt, damit
# überlappende Läufe nie doppelt senden. Dieser Workflow muss daher nur
# im richtigen Fenster feuern. GitHub lässt geplante Läufe oft ausfallen oder
# verzögert sie stark; deshalb alle 15 Minuten, ein ausgefallener Lauf wird vom
# nächsten aufgefangen. Doppelte Mails sind ausgeschlossen (Claim je Schritt).
#
# Voraussetzungen (einmalig):
#   • Repo-Secret  CRON_SECRET   (Settings → Secrets and variables → Actions)
#   • Web-Service (Railway) hat denselben CRON_SECRET
#   • optional Repo-Variable APP_BASE_URL (sonst Default unten)

on:
  schedule:
    # Zeiten in UTC. 6 bis 16 UTC deckt 8 bis 18 Uhr Berlin über Sommer- und
    # Winterzeit ab; Läufe außerhalb des Berliner Fensters sind No-op.
    - cron: "*/15 6-16 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Manuell erzwingen (1 überspringt die Zeitprüfung)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "1"

concurrency:
  group: followup-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Endpoint anstoßen
        env:
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.copilotberater.de' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repo-Secret CRON_SECRET ist nicht gesetzt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          URL="${BASE_URL%/}/api/cron/followup"
          if [ -n "$FORCE" ]; then URL="$URL?force=$FORCE"; fi
          echo "POST $URL"
          code=$(curl -sS -m 180 -o /tmp/resp -w "%{http_code}" \
            -X POST "$URL" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code"
          cat /tmp/resp || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint antwortete mit HTTP $code"
            exit 1
          fi
